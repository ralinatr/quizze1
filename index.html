<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Puzzle Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #auth-screen {
            text-align: center;
            margin-top: 50px;
            width: 100%;
            max-width: 360px;
        }

        #game-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 460px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        h1 {
            font-size: 1.4rem;
            color: #00f2fe;
            margin-bottom: 5px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: #162447;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            width: 100%;
        }

        .highlight {
            color: #4facfe;
            font-weight: bold;
        }

        #game-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            border: 3px solid #00f2fe;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background: #0f172a;
        }

        .image-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.82) saturate(0.92);
            transform: scale(1.08);
            transition: filter 0.35s ease;
        }

        .puzzle-container {
            position: absolute;
            inset: 0;
        }

        .piece {
            --piece-bg: linear-gradient(145deg, #16315f, #0f2346);
            --plug: clamp(20px, 8vw, 34px);

            position: absolute;
            background: var(--piece-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a6d3ff;
            font-weight: bold;
            font-size: 1.15rem;
            transition: opacity 0.35s ease, transform 0.35s ease, background 0.25s ease;
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.03);
        }

        .piece::before,
        .piece::after {
            content: "";
            position: absolute;
            width: var(--plug);
            height: var(--plug);
            border-radius: 50%;
            background: var(--piece-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .piece:hover {
            --piece-bg: linear-gradient(145deg, #1d427a, #153565);
        }

        .piece.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        .p0 {
            left: 0%;
            top: 0%;
            width: 33.333%;
            height: 50%;
            border-radius: 10px 0 0 0;
            z-index: 6;
        }

        .p0::before {
            right: calc(var(--plug) / -2);
            top: 36%;
        }

        .p0::after {
            left: 38%;
            bottom: calc(var(--plug) / -2);
        }

        .p1 {
            left: 33.333%;
            top: 0%;
            width: 33.333%;
            height: 50%;
            z-index: 5;
        }

        .p1::before {
            right: calc(var(--plug) / -2);
            top: 28%;
        }

        .p1::after {
            left: 35%;
            bottom: calc(var(--plug) / -2);
        }

        .p2 {
            left: 66.666%;
            top: 0%;
            width: 33.334%;
            height: 50%;
            border-radius: 0 10px 0 0;
            z-index: 4;
        }

        .p2::before {
            display: none;
        }

        .p2::after {
            left: 42%;
            bottom: calc(var(--plug) / -2);
        }

        .p3 {
            left: 0%;
            top: 50%;
            width: 33.333%;
            height: 50%;
            border-radius: 0 0 0 10px;
            z-index: 3;
        }

        .p3::before {
            right: calc(var(--plug) / -2);
            top: 42%;
        }

        .p3::after {
            display: none;
        }

        .p4 {
            left: 33.333%;
            top: 50%;
            width: 33.333%;
            height: 50%;
            z-index: 2;
        }

        .p4::before {
            right: calc(var(--plug) / -2);
            top: 34%;
        }

        .p4::after {
            display: none;
        }

        .p5 {
            left: 66.666%;
            top: 50%;
            width: 33.334%;
            height: 50%;
            border-radius: 0 0 10px 0;
            z-index: 1;
        }

        .p5::before,
        .p5::after {
            display: none;
        }

        .input-panel {
            width: 100%;
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #162447;
            color: #fff;
            font-size: 1rem;
            outline: none;
            border: 1px solid #4facfe;
        }

        button,
        .button-link {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover,
        .button-link:hover {
            filter: brightness(1.08);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.86);
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        .modal-content {
            background: #162447;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 2px solid #00f2fe;
        }

        .modal p {
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-ans {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-yes {
            background: #4e9f3d;
            color: #fff;
        }

        .btn-no {
            background: #d83a56;
            color: #fff;
        }

        .result-title {
            color: #00f2fe;
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .result-text {
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .result-score {
            margin-top: 10px;
            margin-bottom: 14px;
            color: #a6d3ff;
            font-weight: bold;
        }

        .result-image {
            width: 100%;
            max-width: 280px;
            border-radius: 10px;
            margin: 12px auto 16px;
            display: block;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        .result-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .secondary-btn {
            background: #2b4472;
            color: #fff;
        }

        @media (max-width: 480px) {
            .stats {
                font-size: 0.8rem;
            }

            .input-panel {
                flex-direction: column;
            }

            button,
            .button-link {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="auth-screen">
        <h2>Access Restricted</h2>
        <p style="margin: 15px 0; color: #aaa;">Enter password to start the game:</p>
        <input type="password" id="pass-input" placeholder="Password">
        <button onclick="checkPassword()" style="margin-top: 10px; width: 100%;">Login</button>
    </div>

    <div id="game-content">
        <header>
            <h1>Guess the Object!</h1>
            <div class="stats">
                <div>Level: <span id="lvl" class="highlight">1</span></div>
                <div>Points: <span id="lvl-score" class="highlight">1000</span></div>
                <div>Total: <span id="total-score" class="highlight">0</span></div>
            </div>
        </header>

        <div id="game-board">
            <div class="image-layer" id="game-image"></div>
            <div class="puzzle-container" id="puzzle-box"></div>
        </div>

        <div class="input-panel">
            <input type="text" id="user-guess" placeholder="What is hidden in the photo?">
            <button onclick="makeGuess()">Submit</button>
        </div>
    </div>

    <div class="modal" id="quiz-modal">
        <div class="modal-content">
            <p id="modal-text">Question...</p>
            <div class="modal-buttons">
                <button class="btn-ans btn-yes" onclick="submitQuestionAnswer(true)">Yes</button>
                <button class="btn-ans btn-no" onclick="submitQuestionAnswer(false)">No</button>
            </div>
        </div>
    </div>

    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2 class="result-title" id="result-title">Result</h2>
            <p class="result-text" id="result-text"></p>
            <img id="result-image" class="result-image" src="" alt="Result image" style="display: none;">
            <div class="result-score" id="result-score"></div>
            <div class="result-buttons" id="result-buttons"></div>
        </div>
    </div>

    <script>
        const SECRET_PASSWORD = "hoshi2026";

        const gameLevels = [
            {
                image: "./images/quizze_1.jpeg",
                answer: ["lips", "mouth"],
                questions: [
                    "Is 9 + 6 equal to 15?",
                    "Is the Nile a sea?",
                    "Do plants make oxygen during photosynthesis?",
                    "Does a triangle have four angles?",
                    "Is Earth the third planet from the Sun?",
                    "Does a rectangle always have four equal sides?"
                ],
                keys: [true, false, true, false, true, false]
            },
            {
                image: "./images/quizze_2.png",
                answer: ["hand", "a hand"],
                questions: [
                    "Is 12 divided by 4 equal to 3?",
                    "Is Paris the capital of France?",
                    "Do humans usually have five fingers on one hand?",
                    "Does a square have four equal sides?",
                    "Is the Pacific Ocean smaller than the Black Sea?",
                    "Is the heart a bone?"
                ],
                keys: [true, true, true, true, false, false]
            },
            {
                image: "./images/quizze_3.jpeg",
                answer: ["nose", "a nose"],
                questions: [
                    "Is 20 - 8 equal to 12?",
                    "Is Africa a country?",
                    "Do humans use the nose for smelling?",
                    "Does a circle have corners?",
                    "Is the Amazon River in South America?",
                    "Do fish usually breathe with lungs?"
                ],
                keys: [true, false, true, false, true, false]
            },
            {
                image: "./images/quizze_4.jpeg",
                answer: ["fingers", "finger"],
                questions: [
                    "Is 14 + 5 equal to 19?",
                    "Is Australia both a country and a continent?",
                    "Is 7 × 8 equal to 56?",
                    "Does a cube have six faces?",
                    "Is the Sahara Desert in Europe?",
                    "Do mammals usually feed their babies with milk?"
                ],
                keys: [true, true, true, true, false, true]
            },
            {
                image: "./images/quizze_5.jpeg",
                answer: ["hip", "a hip"],
                questions: [
                    "Is 16 divided by 4 equal to 4?",
                    "Is Tokyo the capital of Japan?",
                    "Does a hexagon have six sides?",
                    "Does a pentagon have five sides?",
                    "Is Antarctica the hottest continent?",
                    "Do humans need oxygen to breathe?"
                ],
                keys: [true, true, true, true, false, true]
            },
            {
                image: "./images/quizze_6.jpeg",
                answer: ["legs", "leg", "a leg"],
                questions: [
                    "Is 18 + 7 equal to 25?",
                    "Is Madrid the capital of Spain?",
                    "Does a triangle have three sides?",
                    "Is the Atlantic Ocean the largest ocean on Earth?",
                    "Do birds usually have feathers?",
                    "Does a right angle measure 90 degrees?"
                ],
                keys: [true, true, true, false, true, true]
            }
        ];

        let currentLevel = 0;
        let totalScore = 0;
        let currentLvlScore = 1000;
        let selectedPieceIdx = null;
        let openedPieces = 0;
        let gameLocked = false;
        let levelStartTotalScore = 0;

        const piecePenalty = 120;
        const wrongGuessPenalty = 100;

        const initialBlur = 18;
        const minBlur = 6;
        const blurStep = 1.7;

        function checkPassword() {
            const password = document.getElementById("pass-input").value;

            if (password === SECRET_PASSWORD) {
                document.getElementById("auth-screen").style.display = "none";
                document.getElementById("game-content").style.display = "flex";
                initGame();
            } else {
                alert("Incorrect password!");
            }
        }

        function initGame() {
            const levelData = gameLevels[currentLevel];

            levelStartTotalScore = totalScore;
            currentLvlScore = 1000;
            selectedPieceIdx = null;
            openedPieces = 0;
            gameLocked = false;

            document.getElementById("lvl").innerText = currentLevel + 1;
            document.getElementById("lvl-score").innerText = currentLvlScore;
            document.getElementById("total-score").innerText = totalScore;
            document.getElementById("user-guess").value = "";

            const gameImage = document.getElementById("game-image");
            gameImage.style.backgroundImage = `url('${levelData.image}')`;

            updateImageBlur();
            hideResultModal();

            const box = document.getElementById("puzzle-box");
            box.innerHTML = "";

            for (let i = 0; i < 6; i++) {
                const el = document.createElement("div");
                el.className = `piece p${i}`;
                el.innerText = i + 1;
                el.dataset.index = i;
                el.onclick = () => triggerQuestion(i);
                box.appendChild(el);
            }
        }

        function updateUI() {
            document.getElementById("lvl-score").innerText = currentLvlScore;
            document.getElementById("total-score").innerText = totalScore;
        }

        function updateImageBlur() {
            const blurValue = Math.max(minBlur, initialBlur - openedPieces * blurStep);
            document.getElementById("game-image").style.filter =
                `blur(${blurValue}px) brightness(0.82) saturate(0.92)`;
        }

        function normalizeAnswer(value) {
            return value
                .trim()
                .toLowerCase()
                .replace(/^a\s+/, "")
                .replace(/[^a-z]/g, "");
        }

        function triggerQuestion(index) {
            if (gameLocked) return;

            const piece = document.querySelector(`.piece[data-index="${index}"]`);

            if (!piece || piece.classList.contains("hidden")) {
                return;
            }

            selectedPieceIdx = index;
            document.getElementById("modal-text").innerText = gameLevels[currentLevel].questions[index];
            document.getElementById("quiz-modal").style.display = "flex";
        }

        function submitQuestionAnswer(userChoice) {
            document.getElementById("quiz-modal").style.display = "none";

            if (gameLocked || selectedPieceIdx === null) {
                return;
            }

            const piece = document.querySelector(`.piece[data-index="${selectedPieceIdx}"]`);

            if (!piece || piece.classList.contains("hidden")) {
                return;
            }

            const currentLevelData = gameLevels[currentLevel];

            if (userChoice === currentLevelData.keys[selectedPieceIdx]) {
                piece.classList.add("hidden");
                openedPieces++;
                currentLvlScore = Math.max(0, currentLvlScore - piecePenalty);
                updateImageBlur();
                updateUI();

                if (currentLvlScore <= 0) {
                    showLoseModal();
                }
            } else {
                alert("Wrong answer! The puzzle piece stays closed.");
            }

            selectedPieceIdx = null;
        }

        function makeGuess() {
            if (gameLocked) return;

            const guess = normalizeAnswer(document.getElementById("user-guess").value);

            if (!guess) {
                return;
            }

            const correctAnswers = gameLevels[currentLevel].answer.map(normalizeAnswer);

            if (correctAnswers.includes(guess)) {
                gameLocked = true;
                totalScore += currentLvlScore;
                updateUI();
                showWinModal();
            } else {
                currentLvlScore = Math.max(0, currentLvlScore - wrongGuessPenalty);
                updateUI();

                if (currentLvlScore <= 0) {
                    showLoseModal();
                } else {
                    alert("Incorrect guess! -100 points.");
                }
            }
        }

        function showWinModal() {
            const levelData = gameLevels[currentLevel];
            const levelNumber = currentLevel + 1;

            document.getElementById("result-title").innerText = "Congratulations!";
            document.getElementById("result-text").innerText =
                `You guessed the object correctly and completed Level ${levelNumber}.`;
            document.getElementById("result-score").innerText =
                `Level score: ${currentLvlScore} | Total score: ${totalScore}`;

            const resultImage = document.getElementById("result-image");
            resultImage.src = levelData.image;
            resultImage.style.display = "block";

            const fileExtension = levelData.image.split(".").pop();

            document.getElementById("result-buttons").innerHTML = `
                <a class="button-link" href="${levelData.image}" download="quizze_level_${levelNumber}_photo.${fileExtension}">Save Photo</a>
                <button onclick="retryCurrentLevel()" class="secondary-btn">Play Again</button>
                <button onclick="nextLevel()">Next Level</button>
            `;

            document.getElementById("result-modal").style.display = "flex";
        }

        function showLoseModal() {
            gameLocked = true;

            document.getElementById("result-title").innerText = "Level failed";
            document.getElementById("result-text").innerText =
                "You ran out of points. You can try this level again from the beginning.";
            document.getElementById("result-score").innerText =
                `Level score: 0 | Total score: ${totalScore}`;

            const resultImage = document.getElementById("result-image");
            resultImage.src = "";
            resultImage.style.display = "none";

            document.getElementById("result-buttons").innerHTML = `
                <button onclick="retryCurrentLevel()">Try Again</button>
            `;

            document.getElementById("result-modal").style.display = "flex";
        }

        function hideResultModal() {
            document.getElementById("result-modal").style.display = "none";
        }

        function retryCurrentLevel() {
            hideResultModal();

            totalScore = levelStartTotalScore;
            updateUI();

            initGame();
        }

        function nextLevel() {
            hideResultModal();

            if (currentLevel < gameLevels.length - 1) {
                currentLevel++;
                initGame();
            } else {
                alert("The next level is coming soon!");
            }
        }

        document.getElementById("pass-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        document.getElementById("user-guess").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                makeGuess();
            }
        });
    </script>

</body>
</html>
