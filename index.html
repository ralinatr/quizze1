<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Quiz Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        #auth-screen { text-align: center; margin-top: 50px; }
        #game-content { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
        header { text-align: center; margin-bottom: 15px; width: 100%; }
        h1 { font-size: 1.4rem; color: #00f2fe; margin-bottom: 5px; }
        .stats { display: flex; justify-content: space-between; background: #162447; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .highlight { color: #4facfe; font-weight: bold; }
        #game-board { width: 100%; aspect-ratio: 1 / 1; position: relative; background-size: cover; background-position: center; border: 3px solid #00f2fe; border-radius: 12px; overflow: hidden; }
        .grid-mask { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .piece { background: #0f3460; border: 2px solid #1a1a2e; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #e94560; transition: all 0.4s ease; }
        .piece.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }
        .input-panel { width: 100%; margin-top: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #162447; color: #fff; font-size: 1rem; outline: none; border: 1px solid #4facfe; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: linear-gradient(45deg, #00f2fe, #4facfe); color: #1a1a2e; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 10; padding: 20px; }
        .modal-content { background: #162447; padding: 25px; border-radius: 12px; text-align: center; max-width: 350px; width: 100%; border: 2px solid #00f2fe; }
        .modal p { font-size: 1.1rem; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn-ans { padding: 10px 25px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-yes { background: #4e9f3d; color: #fff; }
        .btn-no { background: #d83a56; color: #fff; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <h2>Access Restricted</h2>
        <p style="margin: 15px 0; color: #aaa;">Enter password to start the game:</p>
        <input type="password" id="pass-input" placeholder="Password">
        <button onclick="checkPassword()" style="margin-top: 10px; width: 100%;">Login</button>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-content">
        <header>
            <h1>Guess the Object!</h1>
            <div class="stats">
                <div>Level: <span id="lvl" class="highlight">1</span></div>
                <div>Points: <span id="lvl-score" class="highlight">1000</span></div>
                <div>Total: <span id="total-score" class="highlight">0</span></div>
            </div>
        </header>

        <div id="game-board">
            <div class="grid-mask">
                <div class="piece" onclick="triggerQuestion(0)">?</div>
                <div class="piece" onclick="triggerQuestion(1)">?</div>
                <div class="piece" onclick="triggerQuestion(2)">?</div>
                <div class="piece" onclick="triggerQuestion(3)">?</div>
            </div>
        </div>

        <div class="input-panel">
            <input type="text" id="user-guess" placeholder="What is hidden in the photo?">
            <button onclick="makeGuess()">Submit</button>
        </div>
    </div>

    <!-- QUESTION MODAL -->
    <div class="modal" id="quiz-modal">
        <div class="modal-content">
            <p id="modal-text">Question...</p>
            <div class="modal-buttons">
                <button class="btn-ans btn-yes" onclick="submitQuestionAnswer(true)">Yes</button>
                <button class="btn-ans btn-no" onclick="submitQuestionAnswer(false)">No</button>
            </div>
        </div>
    </div>

    <script>
        // UPDATED PASSWORD
        const SECRET_PASSWORD = "hoshi2026"; 

        // LEVEL DATABASE
        const gameLevels = [
            {
                image: "https://unsplash.com", // Cat
                answer: "cat",
                questions: ["Is it a domestic pet?", "Can it bark?", "Does it catch mice?", "Does it have wings?"]
            },
            {
                image: "https://unsplash.com", // Fox
                answer: "fox",
                questions: ["Is it a wild animal?", "Does it live in the ocean?", "Is it orange/red?", "Is it a bird?"]
            }
        ];

        // Correct answers for the questions (True/False)
        const questionKeys = [
            [true, false, true, false], // Level 1 (Cat)
            [true, false, true, false]  // Level 2 (Fox)
        ];

        let currentLevel = 0;
        let totalScore = 0;
        let currentLvlScore = 1000;
        let selectedPieceIdx = null;

        function checkPassword() {
            const entered = document.getElementById("pass-input").value;
            if (entered === SECRET_PASSWORD) {
                document.getElementById("auth-screen").style.display = "none";
                document.getElementById("game-content").style.display = "flex";
                initGame();
            } else {
                alert("Incorrect password!");
            }
        }

        function initGame() {
            if (currentLevel >= gameLevels.length) {
                alert(`Congratulations! Game completed. Final Score: ${totalScore}`);
                return;
            }
            const levelData = gameLevels[currentLevel];
            document.getElementById("lvl").innerText = currentLevel + 1;
            document.getElementById("game-board").style.backgroundImage = `url('${levelData.image}')`;
            currentLvlScore = 1000;
            updateUI();
            document.querySelectorAll('.piece').forEach(p => p.classList.remove('hidden'));
            document.getElementById("user-guess").value = "";
        }

        function updateUI() {
            document.getElementById("lvl-score").innerText = currentLvlScore;
            document.getElementById("total-score").innerText = totalScore;
        }

        function triggerQuestion(index) {
            selectedPieceIdx = index;
            document.getElementById("modal-text").innerText = gameLevels[currentLevel].questions[index];
            document.getElementById("quiz-modal").style.display = "flex";
        }

        function submitQuestionAnswer(userChoice) {
            document.getElementById("quiz-modal").style.display = "none";
            if (userChoice === questionKeys[currentLevel][selectedPieceIdx]) {
                document.querySelectorAll('.piece')[selectedPieceIdx].classList.add('hidden');
                currentLvlScore -= 150;
                if (currentLvlScore < 0) currentLvlScore = 0;
                updateUI();
            } else {
                alert("Wrong answer! The piece stays closed.");
            }
        }

        function makeGuess() {
            if (document.getElementById("user-guess").value.trim().toLowerCase() === gameLevels[currentLevel].answer) {
                alert(`Correct! +${currentLvlScore} points.`);
                totalScore += currentLvlScore;
                currentLevel++;
                initGame();
            } else {
                alert("Incorrect guess! -100 points.");
                currentLvlScore = Math.max(0, currentLvlScore - 100);
                updateUI();
            }
        }
    </script>
</body>
</html>
